# The router: Jev, TypeSafe's System One model (docs.typesafe.ai/models.md).
# Billed per input token; output is free. Called by agent/routing/jev.py.
[router]
model = "jev-latest"
cost = { input = "0.042", output = "0", cache_read = "0.042", cache_write = "0.042" }
