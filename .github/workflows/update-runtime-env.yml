name: Update runtime env

# Manual only. Patches an allowlisted set of the monthly budget, public origins and kit templates in
# the Oracle runtime file, then reruns the backend deploy so the next release
# picks them up. App service and model provider keys come from repository secrets (GH_APP_*, SUPABASE_OAUTH_*,
# ANTHROPIC_API_KEY): each one set
# is written, each one unset leaves the file's value alone. GitHub reserves the GITHUB_ prefix for secrets.
on:
  workflow_dispatch:
    inputs:
      MONTHLY_BUDGET_USD:
        description: Model spend per user per UTC month, USD. Sandbox time does not count
        default: "4.00"
      MAX_CONCURRENT_RUNS:
        description: Builds running at once across the whole service
        default: "18"
      MAX_LIVE_SANDBOXES:
        description: Running sandboxes at once. E2B Hobby allows 20; paused ones do not count
        default: "18"
      FRONTEND_URL:
        description: Deployed frontend origin, used for auth redirects
        default: "https://accretion.abhayymishraa.com"
      PUBLIC_API_URL:
        description: Public backend origin, used for OAuth callback URLs
        default: "https://api.accretion.abhayymishraa.com"
      ALLOWED_ORIGINS:
        description: Comma-separated CORS origins
        default: "https://accretion.abhayymishraa.com"
      E2B_TEMPLATE:
        description: The sandbox template as name:tag; make template-build moves the tag
        default: "accretion:production"
      DEFAULT_KIT:
        description: Kit a new project starts from
        type: choice
        options: [vite-fastapi-postgres, vite-express-postgres, next-postgres, vite-express-mongo]
        default: vite-fastapi-postgres
      RESEND_FROM:
        description: Sender of every email, as Name <address>; the address must be on a domain verified in Resend
        default: "Accretion <hello@accretion.abhayymishraa.com>"
      APP_EMAIL_FROM:
        description: Sender of generated apps' sign-in emails, as Name <address> on a domain verified in Resend
        default: "Accretion <hello@accretion.abhayymishraa.com>"
      redeploy:
        description: Rerun deploy-backend.yml afterwards
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch allowlisted runtime variables
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          NEW_MONTHLY_BUDGET_USD: ${{ inputs.MONTHLY_BUDGET_USD }}
          NEW_MAX_CONCURRENT_RUNS: ${{ inputs.MAX_CONCURRENT_RUNS }}
          NEW_MAX_LIVE_SANDBOXES: ${{ inputs.MAX_LIVE_SANDBOXES }}
          NEW_FRONTEND_URL: ${{ inputs.FRONTEND_URL }}
          NEW_PUBLIC_API_URL: ${{ inputs.PUBLIC_API_URL }}
          NEW_ALLOWED_ORIGINS: ${{ inputs.ALLOWED_ORIGINS }}
          NEW_E2B_TEMPLATE: ${{ inputs.E2B_TEMPLATE }}
          NEW_DEFAULT_KIT: ${{ inputs.DEFAULT_KIT }}
          NEW_RESEND_FROM: ${{ inputs.RESEND_FROM }}
          NEW_APP_EMAIL_FROM: ${{ inputs.APP_EMAIL_FROM }}
          RAW_GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          RAW_GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          RAW_GITHUB_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          RAW_GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          RAW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          RAW_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          RAW_SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
          RAW_SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
          RAW_VERCEL_CLIENT_ID: ${{ secrets.VERCEL_CLIENT_ID }}
          RAW_VERCEL_CLIENT_SECRET: ${{ secrets.VERCEL_CLIENT_SECRET }}
          RAW_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"

          # Reject anything that is not a plain non-negative number.
          for key in MONTHLY_BUDGET_USD MAX_CONCURRENT_RUNS MAX_LIVE_SANDBOXES; do
            var="NEW_${key}"
            [[ "${!var}" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid value for $key"; exit 1; }
          done

          [[ "$NEW_E2B_TEMPLATE" =~ ^[a-z0-9][a-z0-9_-]*:[A-Za-z0-9._-]+$ ]] || { echo "Invalid E2B_TEMPLATE; use name:tag"; exit 1; }

          # Origins only: https, a host, optional port. No path, no credentials.
          # ALLOWED_ORIGINS may list several. Values land in runtime.env verbatim.
          origin='https://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?'
          for key in FRONTEND_URL PUBLIC_API_URL; do
            var="NEW_${key}"
            [[ "${!var}" =~ ^${origin}$ ]] || { echo "Invalid origin for $key"; exit 1; }
          done
          [[ "$NEW_ALLOWED_ORIGINS" =~ ^${origin}(,${origin})*$ ]] || { echo 'Invalid ALLOWED_ORIGINS'; exit 1; }

          # A display name and one address, nothing else: no quotes, no newline that could add a line to runtime.env.
          sender='^[A-Za-z0-9 ._-]+ <[A-Za-z0-9._%+-]+@[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}>$'
          [[ "$NEW_RESEND_FROM" =~ $sender ]] || { echo 'Invalid RESEND_FROM; use Name <address>'; exit 1; }
          [[ "$NEW_APP_EMAIL_FROM" =~ $sender ]] || { echo 'Invalid APP_EMAIL_FROM; use Name <address>'; exit 1; }

          # Secrets travel on stdin ahead of the remote script, never on a command line, base64-encoded so no
          # character in them can break the script. The private key goes as one line with "\n" escaped, which
          # the API unescapes. An unset secret travels empty.
          secret_keys="GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_APP_CLIENT_ID GITHUB_APP_CLIENT_SECRET GITHUB_APP_PRIVATE_KEY GITHUB_APP_WEBHOOK_SECRET SUPABASE_OAUTH_CLIENT_ID SUPABASE_OAUTH_CLIENT_SECRET VERCEL_CLIENT_ID VERCEL_CLIENT_SECRET ANTHROPIC_API_KEY"
          secret_lines=""
          for key in $secret_keys; do
            raw="RAW_${key}"
            value="${!raw//$'\r'/}"
            value="${value//$'\n'/\\n}"
            secret_lines+="SECRET_${key}=$(printf '%s' "$value" | base64 -w0)"$'\n'
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh_args=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes
                    -o StrictHostKeyChecking=yes -o ConnectTimeout=15)

          # Values travel as environment variables, never on the command line.
          # ssh joins them into one line that the host parses again, so RESEND_FROM is quoted to keep its
          # spaces and <> as one value; the sender check above rejects any ' inside it.
          ssh "${ssh_args[@]}" \
            "ubuntu@$DEPLOY_HOST" \
            NEW_MONTHLY_BUDGET_USD="$NEW_MONTHLY_BUDGET_USD" \
            NEW_MAX_CONCURRENT_RUNS="$NEW_MAX_CONCURRENT_RUNS" \
            NEW_MAX_LIVE_SANDBOXES="$NEW_MAX_LIVE_SANDBOXES" \
            NEW_FRONTEND_URL="$NEW_FRONTEND_URL" \
            NEW_PUBLIC_API_URL="$NEW_PUBLIC_API_URL" \
            NEW_ALLOWED_ORIGINS="$NEW_ALLOWED_ORIGINS" \
            NEW_E2B_TEMPLATE="$NEW_E2B_TEMPLATE" \
            NEW_DEFAULT_KIT="$NEW_DEFAULT_KIT" \
            NEW_RESEND_FROM="'$NEW_RESEND_FROM'" \
            NEW_APP_EMAIL_FROM="'$NEW_APP_EMAIL_FROM'" \
            'bash -s' < <(printf '%s' "$secret_lines"; cat <<'REMOTE'
          set -euo pipefail
          export secret_keys="GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_APP_CLIENT_ID GITHUB_APP_CLIENT_SECRET GITHUB_APP_PRIVATE_KEY GITHUB_APP_WEBHOOK_SECRET SUPABASE_OAUTH_CLIENT_ID SUPABASE_OAUTH_CLIENT_SECRET VERCEL_CLIENT_ID VERCEL_CLIENT_SECRET ANTHROPIC_API_KEY"
          for key in $secret_keys; do
            encoded="SECRET_${key}"
            export "NEW_${key}=$(printf '%s' "${!encoded}" | base64 -d)"
          done
          file=/opt/webbuilder/runtime.env
          # Root-owned and mode 600, so the existence test needs sudo too.
          sudo test -s "$file" || { echo 'Missing runtime.env'; exit 1; }

          backup="${file}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          sudo cp -p "$file" "$backup"
          sudo chmod 600 "$backup"
          echo "Backed up to $(basename "$backup")"
          # Every backup is another full secrets copy, so do not let them pile up.
          # The whole pipeline runs under sudo: the glob expands in the calling
          # shell, which cannot read the directory. Housekeeping never aborts the job.
          sudo sh -c "ls -1t '${file}'.bak.* 2>/dev/null | tail -n +6 | xargs -r rm -f" || true

          tmp=$(mktemp)
          # Holds a full copy of the runtime file, secrets included, until tee lands it.
          trap 'rm -f "$tmp"' EXIT
          sudo cat "$file" | awk '
            BEGIN {
              split("MONTHLY_BUDGET_USD MAX_CONCURRENT_RUNS MAX_LIVE_SANDBOXES FRONTEND_URL PUBLIC_API_URL ALLOWED_ORIGINS E2B_TEMPLATE DEFAULT_KIT RESEND_FROM APP_EMAIL_FROM", a, " ")
              for (i in a) want[a[i]] = ENVIRON["NEW_" a[i]]
              split(ENVIRON["secret_keys"], s, " ")
              for (i in s) if (ENVIRON["NEW_" s[i]] != "") want[s[i]] = ENVIRON["NEW_" s[i]]
            }
            {
              eq = index($0, "=")
              key = eq ? substr($0, 1, eq - 1) : ""
              if (key != "" && (key in want)) { print key "=" want[key]; seen[key] = 1 }
              else { print }
            }
            END { for (k in want) if (!(k in seen)) print k "=" want[k] }
          ' > "$tmp"

          # tee preserves the inode, owner and mode of the existing file.
          sudo tee "$file" < "$tmp" > /dev/null
          rm -f "$tmp"

          # env_file values are baked in when the container is created, so the
          # running API keeps the old ones until it is recreated. Redeploying does
          # not do it: deploy.sh short-circuits when the release is already current.
          release=$(sudo readlink -f /opt/webbuilder/current 2>/dev/null || true)
          if sudo test -f "$release/compose.yaml"; then
            compose() {
              sudo docker compose -p webbuilder --env-file "$release/deployment.env" \
                -f "$release/compose.yaml" "$@"
            }
            compose up -d --no-deps --force-recreate api
            healthy=false
            for _ in $(seq 1 40); do
              container=$(compose ps -q api || true)
              if [ -n "$container" ] &&
                 [ "$(sudo docker inspect -f '{{.State.Health.Status}}' "$container")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 3
            done
            if [ "$healthy" != true ]; then
              echo 'API did not become healthy; restoring the previous runtime.env.'
              sudo cp -p "$backup" "$file"
              compose up -d --no-deps --force-recreate api
              exit 1
            fi
            echo 'API recreated and healthy.'
          else
            echo 'No current release; the next deploy will pick these up.'
          fi

          # Report key names and whether they changed. Never print other lines.
          for k in MONTHLY_BUDGET_USD MAX_CONCURRENT_RUNS MAX_LIVE_SANDBOXES FRONTEND_URL PUBLIC_API_URL ALLOWED_ORIGINS E2B_TEMPLATE DEFAULT_KIT RESEND_FROM APP_EMAIL_FROM; do
            before=$(sudo grep -E "^${k}=" "$backup" | head -1 | cut -d= -f2- || true)
            after=$(sudo grep -E "^${k}=" "$file" | head -1 | cut -d= -f2- || true)
            printf '  %-32s %s -> %s\n' "$k" "${before:-<unset>}" "$after"
          done
          # Secrets: whether each is set and whether this run changed it. Never the value.
          for k in $secret_keys; do
            before=$(sudo grep -E "^${k}=" "$backup" | head -1 | cut -d= -f2- || true)
            after=$(sudo grep -E "^${k}=" "$file" | head -1 | cut -d= -f2- || true)
            state=$([ -n "$after" ] && echo set || echo unset)
            [ "$before" != "$after" ] && state="$state (changed)"
            printf '  %-32s %s\n' "$k" "$state"
          done
          echo "runtime.env line count: $(sudo wc -l "$file" | awk '{print $1}')"
          REMOTE
          )

      - name: Rerun the backend deploy
        if: ${{ inputs.redeploy }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-backend.yml --ref main --repo "$GITHUB_REPOSITORY"
