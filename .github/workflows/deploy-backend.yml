name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'auth/**'
      - 'db/**'
      - 'skills/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: webbuilder-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Package runtime artifact
        run: docker save webbuilder-backend:"$GITHUB_SHA" | gzip -1 > backend-image.tar.gz
      - name: Deploy and check readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
          BACKEND_DOMAIN_ALT: ${{ vars.BACKEND_DOMAIN_ALT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$BACKEND_DOMAIN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          # Optional; Caddy serves it beside the primary while a domain moves.
          [[ -z "${BACKEND_DOMAIN_ALT:-}" || "$BACKEND_DOMAIN_ALT" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh_args=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          destination="ubuntu@$DEPLOY_HOST"
          directory="/tmp/webbuilder-$GITHUB_SHA"
          trap 'rm -f ~/.ssh/deploy_key; rm -f backend-image.tar.gz' EXIT
          ssh "${ssh_args[@]}" "$destination" "mkdir -p '$directory/deploy'"
          scp "${ssh_args[@]}" backend-image.tar.gz "$destination:$directory/"
          scp "${ssh_args[@]}" deploy/deploy.sh deploy/compose.yaml deploy/Caddyfile "$destination:$directory/deploy/"
          ssh "${ssh_args[@]}" "$destination" "sudo bash '$directory/deploy/deploy.sh' '$GITHUB_SHA' '$BACKEND_DOMAIN' '${BACKEND_DOMAIN_ALT:-}'"
          ssh "${ssh_args[@]}" "$destination" "rm -rf '$directory'"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 6 \
            --max-time 15 "https://$BACKEND_DOMAIN/health/ready"
